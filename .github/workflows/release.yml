name: release-windows-x64

# ================================================================
# Fully-online release pipeline (NO local uploads, NO vendored libs).
#
# Two-layer architecture (LLVM toolchain decoupled from business build):
#   Layer 1 - llvm-toolchain job:
#       Builds LLVM/Clang 18.1.8 static libs from official source ONCE,
#       assembles flat LLVM_ROOT {include,lib}, caches it.
#       Rebuilds ONLY when LLVM version / source / compile flags change
#       (cache key encodes version + flags). Business build failures
#       NEVER invalidate this cache.
#   Layer 2 - codex-build-release job:
#       Restores cached flat LLVM_ROOT, does incremental compile of
#       codex_lan_agent only (LLVM .lib are prebuilt external deps,
#       business source changes do NOT trigger LLVM recompile).
# ================================================================

on:
  push:
    tags:
      - "v*-x64"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create release for (e.g. v2026.08.09-x64)"
        required: false
        default: ""
        type: string
      force_rebuild_llvm:
        description: "Force rebuild LLVM toolchain (ignore cache)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  LLVM_VERSION: 18.1.8
  # Cache key encodes: LLVM version + compile flags + toolchain.
  # Bump the -vN suffix ONLY when changing LLVM compile flags or upgrading.
  LLVM_CACHE_KEY: llvm-18.1.8-static-flat-msvc-ninja-v3
  ARCH: x64

jobs:
  # ============================================================
  # Layer 1: LLVM/Clang toolchain (independent, cache-persistent)
  # ============================================================
  llvm-toolchain:
    name: "Layer 1 · LLVM/Clang 18.1.8 toolchain (cached)"
    runs-on: windows-latest
    outputs:
      llvm_root: ${{ steps.llvm-root-output.outputs.llvm_root }}
      cache_hit: ${{ steps.cache-llvm.outputs.cache-hit }}

    steps:
      - name: Probe MSVC (vcvars64 path)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $VS_INSTALL = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS install: $VS_INSTALL"
          $vcvars = Join-Path $VS_INSTALL "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "vcvars: $vcvars"
          "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache flat LLVM/Clang 18.1.8 static libs
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/llvm_root
          key: ${{ env.LLVM_CACHE_KEY }}
          # Save even if later steps in THIS job fail (build errors etc.).
          # Layer 2 depends on this cache being saved when build succeeds.
          save-always: true

      - name: Build LLVM/Clang 18.1.8 static libs from source & assemble flat LLVM_ROOT
        if: |
          steps.cache-llvm.outputs.cache-hit != 'true' ||
          github.event.inputs.force_rebuild_llvm == 'true'
        shell: cmd
        run: |
          call "%VCVARS_PATH%"
          echo on
          set LLVM_SRC=%RUNNER_WORKSPACE%\llvm-project-src
          set LLVM_BUILD=%RUNNER_WORKSPACE%\llvm-project-build
          set LLVM_ROOT_FLAT=%RUNNER_WORKSPACE%\llvm_root
          if exist %LLVM_SRC% rmdir /s /q %LLVM_SRC%
          if exist %LLVM_BUILD% rmdir /s /q %LLVM_BUILD%
          if exist %LLVM_ROOT_FLAT% rmdir /s /q %LLVM_ROOT_FLAT%
          :: Shallow clone official LLVM monorepo at the exact release tag.
          git clone --depth 1 --branch llvmorg-%LLVM_VERSION% https://github.com/llvm/llvm-project.git %LLVM_SRC%
          if errorlevel 1 exit /b 1
          :: Configure: Ninja + MSVC, static libs only, X86 target only,
          :: tests/examples/benchmarks/docs/tools disabled to minimize build time.
          cmake -G Ninja -S %LLVM_SRC%\llvm -B %LLVM_BUILD% ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DLLVM_ENABLE_PROJECTS=clang ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DLLVM_TARGETS_TO_BUILD=X86 ^
            -DLLVM_INCLUDE_TESTS=OFF ^
            -DLLVM_INCLUDE_EXAMPLES=OFF ^
            -DLLVM_INCLUDE_BENCHMARKS=OFF ^
            -DLLVM_INCLUDE_DOCS=OFF ^
            -DCLANG_INCLUDE_TESTS=OFF ^
            -DCLANG_INCLUDE_DOCS=OFF ^
            -DLLVM_BUILD_TOOLS=OFF ^
            -DCLANG_BUILD_TOOLS=OFF ^
            -DLLVM_ENABLE_DIA_SDK=OFF
          if errorlevel 1 exit /b 1
          :: Build all static libs (no tools since LLVM_BUILD_TOOLS=OFF).
          cmake --build %LLVM_BUILD% --config Release --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          :: Assemble flat LLVM_ROOT: <ROOT>/include + <ROOT>/lib
          mkdir %LLVM_ROOT_FLAT%\include
          mkdir %LLVM_ROOT_FLAT%\lib
          :: (1) Clang public headers (source tree)
          xcopy /y /e /i %LLVM_SRC%\clang\include\clang %LLVM_ROOT_FLAT%\include\clang >nul
          if exist %LLVM_SRC%\clang\include\clang-c xcopy /y /e /i %LLVM_SRC%\clang\include\clang-c %LLVM_ROOT_FLAT%\include\clang-c >nul
          :: (2) LLVM public headers (source tree)
          xcopy /y /e /i %LLVM_SRC%\llvm\include\llvm %LLVM_ROOT_FLAT%\include\llvm >nul
          if exist %LLVM_SRC%\llvm\include\llvm-c xcopy /y /e /i %LLVM_SRC%\llvm\include\llvm-c %LLVM_ROOT_FLAT%\include\llvm-c >nul
          :: (3) LLVM generated config (llvm/Config/llvm-config.h, config.h, abi-breaking.h, ...)
          xcopy /y /e /i %LLVM_BUILD%\include\llvm\Config %LLVM_ROOT_FLAT%\include\llvm\Config >nul
          :: (3b) LLVM generated headers (TableGen .inc under build/include/llvm)
          ::     e.g. llvm/Frontend/OpenMP/OMP.inc required by clang/AST/ASTFwd.h.
          ::     Merges ALL build-tree generated llvm headers on top of source headers
          ::     (Intrinsics*.inc, Frontend/OpenMP/OMP.inc, etc.) - not just Config.
          xcopy /y /e /i %LLVM_BUILD%\include\llvm %LLVM_ROOT_FLAT%\include\llvm >nul
          :: (4) Clang TableGen generated files (*.inc) + clang/Config/Version.inc etc.
          ::     Covers all known CMake layout variants:
          ::     - ENABLE_PROJECTS=clang -> build/tools/clang/include/clang
          ::     - llvm/projects/clang legacy -> build/projects/clang/include/clang
          ::     - NATIVE/{tools,projects} cross wrappers
          if exist %LLVM_BUILD%\tools\clang\include\clang (
            xcopy /y /e /i %LLVM_BUILD%\tools\clang\include\clang %LLVM_ROOT_FLAT%\include\clang >nul
          )
          if exist %LLVM_BUILD%\projects\clang\include\clang (
            xcopy /y /e /i %LLVM_BUILD%\projects\clang\include\clang %LLVM_ROOT_FLAT%\include\clang >nul
          )
          if exist %LLVM_BUILD%\NATIVE\tools\clang\include\clang (
            xcopy /y /e /i %LLVM_BUILD%\NATIVE\tools\clang\include\clang %LLVM_ROOT_FLAT%\include\clang >nul
          )
          if exist %LLVM_BUILD%\NATIVE\projects\clang\include\clang (
            xcopy /y /e /i %LLVM_BUILD%\NATIVE\projects\clang\include\clang %LLVM_ROOT_FLAT%\include\clang >nul
          )
          :: (5) All static .lib produced by the build
          copy /y %LLVM_BUILD%\lib\*.lib %LLVM_ROOT_FLAT%\lib\ >nul
          :: Sanity verification (source + TableGen .inc + .lib)
          if not exist %LLVM_ROOT_FLAT%\include\clang\AST\ASTConsumer.h (
            echo ERROR: clang AST source header missing & exit /b 1
          )
          if not exist %LLVM_ROOT_FLAT%\include\clang\Basic\DiagnosticCommonKinds.inc (
            echo ERROR: TableGen DiagnosticCommonKinds.inc missing - assembly incomplete & exit /b 1
          )
          if not exist %LLVM_ROOT_FLAT%\include\llvm\Frontend\OpenMP\OMP.inc (
            echo ERROR: LLVM generated OMP.inc missing - assembly incomplete & exit /b 1
          )
          if not exist %LLVM_ROOT_FLAT%\lib\clangTooling.lib (
            echo ERROR: clangTooling.lib missing & exit /b 1
          )
          dir /b %LLVM_ROOT_FLAT%\lib\*.lib | find /c /v "" > %TEMP%\libcount.txt
          set /p LIBCOUNT=<%TEMP%\libcount.txt
          echo LLVM flat root assembled at %LLVM_ROOT_FLAT% (%LIBCOUNT% .lib files)

      - name: Verify LLVM_ROOT integrity (cache hit or fresh build)
        shell: pwsh
        run: |
          $Root = Join-Path "${{ runner.workspace }}" "llvm_root"
          $h    = Join-Path $Root "include\clang\AST\ASTConsumer.h"
          $inc  = Join-Path $Root "include\clang\Basic\DiagnosticCommonKinds.inc"
          $omp  = Join-Path $Root "include\llvm\Frontend\OpenMP\OMP.inc"
          $l    = Join-Path $Root "lib\clangTooling.lib"
          if (-not (Test-Path $h))   { Write-Error "Missing $h"; exit 1 }
          if (-not (Test-Path $inc)) { Write-Error "Missing TableGen header $inc (clang .inc assembly incomplete)"; exit 1 }
          if (-not (Test-Path $omp)) { Write-Error "Missing LLVM generated header $omp (llvm .inc assembly incomplete)"; exit 1 }
          if (-not (Test-Path $l))   { Write-Error "Missing $l"; exit 1 }
          $libCount = (Get-ChildItem (Join-Path $Root "lib") -Filter "*.lib").Count
          $incCount = (Get-ChildItem (Join-Path $Root "include\clang") -Recurse -Filter "*.inc").Count
          $llvmIncCount = (Get-ChildItem (Join-Path $Root "include\llvm") -Recurse -Filter "*.inc").Count
          Write-Host "LLVM_ROOT=$Root  (.lib count: $libCount, clang .inc: $incCount, llvm .inc: $llvmIncCount)"

      - name: Export LLVM_ROOT path for downstream job
        id: llvm-root-output
        shell: pwsh
        run: |
          $Root = Join-Path "${{ runner.workspace }}" "llvm_root"
          "llvm_root=$Root" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  # ============================================================
  # Layer 2: Business build (incremental, uses cached LLVM_ROOT)
  # ============================================================
  codex-build-release:
    name: "Layer 2 · codex_lan_agent build + Release"
    runs-on: windows-latest
    needs: llvm-toolchain

    steps:
      - name: Checkout codex-lan-agent sources (CMakeLists.txt + src/ only)
        uses: actions/checkout@v4

      - name: Probe MSVC (vcvars64 path)
        shell: pwsh
        run: |
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          Write-Host "ninja: $ninja"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $VS_INSTALL = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS install: $VS_INSTALL"
          $vcvars = Join-Path $VS_INSTALL "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "vcvars: $vcvars"
          "VCVARS_PATH=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore cached flat LLVM_ROOT (Layer 1 output)
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/llvm_root
          key: ${{ env.LLVM_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Verify LLVM_ROOT integrity
        shell: pwsh
        run: |
          $Root = Join-Path "${{ runner.workspace }}" "llvm_root"
          $h    = Join-Path $Root "include\clang\AST\ASTConsumer.h"
          $inc  = Join-Path $Root "include\clang\Basic\DiagnosticCommonKinds.inc"
          $omp  = Join-Path $Root "include\llvm\Frontend\OpenMP\OMP.inc"
          $l    = Join-Path $Root "lib\clangTooling.lib"
          if (-not (Test-Path $h))   { Write-Error "Missing $h"; exit 1 }
          if (-not (Test-Path $inc)) { Write-Error "Missing TableGen header $inc (clang .inc assembly incomplete)"; exit 1 }
          if (-not (Test-Path $omp)) { Write-Error "Missing LLVM generated header $omp (llvm .inc assembly incomplete)"; exit 1 }
          if (-not (Test-Path $l))   { Write-Error "Missing $l"; exit 1 }
          $libCount = (Get-ChildItem (Join-Path $Root "lib") -Filter "*.lib").Count
          $incCount = (Get-ChildItem (Join-Path $Root "include\clang") -Recurse -Filter "*.inc").Count
          $llvmIncCount = (Get-ChildItem (Join-Path $Root "include\llvm") -Recurse -Filter "*.inc").Count
          Write-Host "LLVM_ROOT=$Root  (.lib count: $libCount, clang .inc: $incCount, llvm .inc: $llvmIncCount)  [Layer 1 cache-hit: ${{ needs.llvm-toolchain.outputs.cache_hit }}]"

      - name: Configure codex_lan_agent (Ninja + vcvars64, with Clang AST)
        shell: cmd
        run: |
          call "%VCVARS_PATH%"
          set REPO=%CD%
          set INSTALLDIR=%RUNNER_WORKSPACE%\llvm_root
          set BUILD=%REPO%\build_release_x64
          :: Ninja single-config; CMAKE_BUILD_TYPE=Release passed directly.
          :: LLVM_ROOT is a prebuilt external dependency (Layer 1 cache) —
          :: business source changes NEVER trigger LLVM recompile.
          cmake -S %REPO% -B %BUILD% ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCODEX_LAN_AGENT_ENABLE_CLANG_AST=ON ^
            -DCODEX_LAN_AGENT_BUILD_CLANG_INDEXER=OFF ^
            -DCODEX_LAN_AGENT_COPY_TO_ROOT=OFF ^
            -DCODEX_LAN_AGENT_BUNDLE_CMM=OFF ^
            -DCODEX_LLVM_ROOT="%INSTALLDIR%"
          if errorlevel 1 exit /b 1

      - name: Build codex_lan_agent (Release · incremental)
        shell: cmd
        run: |
          call "%VCVARS_PATH%"
          set BUILD=%CD%\build_release_x64
          cmake --build %BUILD% --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1
          :: Ninja single-config: exe lands directly in build_release_x64\codex_lan_agent.exe
          if not exist %BUILD%\codex_lan_agent.exe (
            echo ERROR: codex_lan_agent.exe not built & exit /b 1
          )
          for %%I in (%BUILD%\codex_lan_agent.exe) do echo Build OK: %%I  size=%%~zI bytes

      - name: Stage release package
        shell: pwsh
        run: |
          $Repo = Get-Location
          $Exe = Join-Path $Repo "build_release_x64\codex_lan_agent.exe"
          if (-not (Test-Path $Exe)) { Write-Error "exe missing at $Exe"; exit 1 }
          $Stage = Join-Path $Repo "stage\codex_lan_agent-windows-x64"
          New-Item -ItemType Directory -Force -Path (Join-Path $Stage "bin") | Out-Null
          Copy-Item $Exe (Join-Path $Stage "bin\codex_lan_agent.exe")
          if (Test-Path (Join-Path $Repo "codex_lan_agent.cfg")) {
            Copy-Item (Join-Path $Repo "codex_lan_agent.cfg") $Stage
          }
          if (Test-Path (Join-Path $Repo "README.md")) {
            Copy-Item (Join-Path $Repo "README.md") $Stage
          }
          if (Test-Path (Join-Path $Repo "LICENSE")) {
            Copy-Item (Join-Path $Repo "LICENSE") $Stage
          }
          $Zip = Join-Path $Repo "codex_lan_agent-windows-x64.zip"
          if (Test-Path $Zip) { Remove-Item $Zip }
          Compress-Archive -Path (Join-Path $Stage "*") -DestinationPath $Zip
          $zipItem = Get-Item $Zip
          Write-Host "Package: $($zipItem.Name)  $([math]::Round($zipItem.Length/1MB,2)) MB"

      - name: Create GitHub Release and upload artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Repo = Get-Location
          $Zip = Join-Path $Repo "codex_lan_agent-windows-x64.zip"
          if (-not (Test-Path $Zip)) { Write-Error "zip missing" ; exit 1 }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.tag }}' -ne '') {
            $Tag = '${{ github.event.inputs.tag }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $Tag = '${{ github.ref_name }}'
          } else {
            $Tag = 'v' + (Get-Date -Format 'yyyy.MM.dd') + '-x64'
            Write-Host "No tag context, fallback: $Tag"
          }
          $Sha = (git rev-parse HEAD).Substring(0,7)
          $Layer1Hit = '${{ needs.llvm-toolchain.outputs.cache_hit }}'
          $Body = @"
          ## codex_lan_agent $Tag (Windows x64)

          ### Two-layer build (GitHub-hosted runner)
          - **Layer 1 - LLVM toolchain**: LLVM/Clang 18.1.8 built from source (tag llvmorg-18.1.8)
            - Status: $(if ($Layer1Hit -eq 'true') {'cache HIT (reused prebuilt static libs, ~seconds)'} else {'cache MISS (rebuilt from source, ~2h)'})
            - Cache key: ```${{ env.LLVM_CACHE_KEY }}```
            - Rebuild trigger: LLVM version/source/compile-flags change ONLY
          - **Layer 2 - Business build**: codex_lan_agent incremental compile on cached LLVM_ROOT
            - Toolchain: MSVC (vcvars64) + Ninja
            - Static linkage: all LLVM/Clang .lib statically linked into the exe
          - Commit sha: $Sha

          ### Third-party dependencies (ALL from network sources, NOTHING vendored in repo)
          - **LLVM/Clang 18.1.8** built from official source:
            - Source: https://github.com/llvm/llvm-project/tree/llvmorg-18.1.8
            - Configure: -DBUILD_SHARED_LIBS=OFF -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_ENABLE_PROJECTS=clang
            - License: Apache-2.0 WITH LLVM-exception  https://llvm.org/LICENSE.txt
          - Static .lib cached on GitHub Actions cache (decoupled from business build).
          - Release ZIP contains NO .lib/.dll. Repo NEVER ships third-party binaries.

          ### Dependency isolation
          LLVM .lib are prebuilt external artifacts (flat LLVM_ROOT restored from cache).
          Business source changes compile ONLY codex_lan_agent — never retrigger LLVM build.

          ### Reproduce locally
          ```powershell
          git clone https://github.com/${{ github.repository }}.git
          cd codex-lan-agent
          # Layer 1 (one-time): build LLVM 18.1.8 from source (network)
          #   git clone --depth 1 --branch llvmorg-18.1.8 https://github.com/llvm/llvm-project.git
          #   cmake -G Ninja -S llvm-project\llvm -B llvm-build `
          #     -DLLVM_ENABLE_PROJECTS=clang -DBUILD_SHARED_LIBS=OFF -DLLVM_TARGETS_TO_BUILD=X86 `
          #     -DCMAKE_BUILD_TYPE=Release
          #   cmake --build llvm-build --parallel
          #   # assemble third_party\llvm\{include,lib} from build output + source headers
          # Layer 2 (incremental):
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCODEX_LAN_AGENT_ENABLE_CLANG_AST=ON
          cmake --build build --parallel
          ```

          ### Repo contents policy (.gitignore whitelist · enforced)
          - Allowed: ``CMakeLists.txt`` · ``src/**`` · ``.github/workflows/**``
          - DENIED: ``*.exe *.dll *.lib *.obj *.o *.a`` · images · archives · ``third_party/`` · ``vendor/``
          "@
          $NotesFile = Join-Path $env:RUNNER_TEMP "release_notes_$Tag.md"
          $Body | Out-File -FilePath $NotesFile -Encoding utf8
          $existing = gh release view $Tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $Tag..."
            gh release create $Tag --repo '${{ github.repository }}' `
              --title "codex_lan_agent $Tag · Windows x64 (LLVM 18.1.8 · two-layer online build)" `
              --notes-file $NotesFile `
              --target '${{ github.sha }}' `
              $Zip
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          } else {
            Write-Host "Release $Tag exists; uploading asset..."
            gh release upload $Tag --repo '${{ github.repository }}' --clobber $Zip
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          }
          Write-Host "=== Release completed for tag $Tag ==="

