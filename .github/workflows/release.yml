name: release-windows-x64

# ================================================================
# Fully-online release pipeline (NO local uploads, NO vendored libs).
# Third-party LLVM/Clang is downloaded from official GitHub releases.
# ================================================================

on:
  push:
    tags:
      - "v*-x64"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to create release for (e.g. v2026.08.09-x64)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  LLVM_VERSION: 18.1.8
  ARCH: x64

jobs:
  build-and-release:
    name: Build + Release (Windows x64 · LLVM/Clang 18.1.8)
    runs-on: windows-latest

    steps:
      - name: Checkout sources (CMakeLists.txt + src/ only, per repo policy)
        uses: actions/checkout@v4

      - name: Probe VS version available on runner & set CMAKE_GENERATOR
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $VS_INSTALL = $null
          if (Test-Path $vswhere) {
            $VS_INSTALL = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            Write-Host "VS install: $VS_INSTALL"
            $verLine = & $vswhere -latest -products * -property catalog_productLineVersion
            Write-Host "VS productLineVersion: $verLine"
          }
          # Map to a CMake Visual Studio generator string known to cmake --help
          $GEN = $null
          $gens = cmake --help | Select-String 'Visual Studio \d+' | ForEach-Object { $_.Line }
          $gens | Select-Object -Last 20 | ForEach-Object { Write-Host "  $_" }
          # Prefer VS17 (2022) since it's the generator our CMakeLists was tested with;
          # fall back to the newest available on the runner.
          foreach ($g in @("Visual Studio 17 2022", "Visual Studio 18 2022")) {
            if ($gens -match [regex]::Escape($g)) { $GEN = $g; break }
          }
          if (-not $GEN) {
            # pick the first Visual Studio NN YYYY from the list
            $m = $gens -match 'Visual Studio (\d+) (\d+)' | Select-Object -First 1
            if ($m) { $GEN = ($m -split '\s{2,}')[0].Trim() }
          }
          if (-not $GEN) { throw "No Visual Studio generator found" }
          Write-Host "Using CMAKE_GENERATOR=$GEN"
          "CMAKE_GENERATOR=$GEN" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache LLVM/Clang download & extract
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/llvm-18.1.8-win64
          key: llvm-18.1.8-win64-vs2022-flat

      - name: Download LLVM/Clang 18.1.8 (official network source) & flatten
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Version = "$env:LLVM_VERSION"
          $BaseUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$Version"
          $Exe = "LLVM-$Version-win64.exe"
          $Url = "$BaseUrl/$Exe"
          $Dest = Join-Path $env:RUNNER_TEMP $Exe
          Write-Host "Downloading $Url -> $Dest"
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $maxRetries = 5
          for ($i=1; $i -le $maxRetries; $i++) {
            try {
              Invoke-WebRequest -Uri $Url -OutFile $Dest -UseBasicParsing
              $sz = [math]::Round((Get-Item $Dest).Length/1MB,2)
              Write-Host "Download OK: ${sz} MB"
              break
            } catch {
              Write-Host "Attempt $i/$maxRetries failed: $_"
              if ($i -eq $maxRetries) { throw }
              Start-Sleep -Seconds (5 * $i)
            }
          }
          $Root = Join-Path "${{ runner.workspace }}" "llvm-18.1.8-win64"
          $Extract = Join-Path $Root "_sfx_extract"
          New-Item -ItemType Directory -Force -Path $Extract | Out-Null
          $SevenZip = "${env:ProgramFiles}\7-Zip\7z.exe"
          if (-not (Test-Path $SevenZip)) { $SevenZip = "${env:ProgramFiles(x86)}\7-Zip\7z.exe" }
          if (Test-Path $SevenZip) {
            Write-Host "Extracting via 7z -> $Extract"
            & $SevenZip x -y -o"$Extract" $Dest | Select-Object -Last 3
            if ($LASTEXITCODE -ne 0) { Write-Error "7z extract failed"; exit 1 }
          } else {
            Write-Host "7z missing; fall back to SFX silent extraction"
            $proc = Start-Process -FilePath $Dest -ArgumentList "/S /D=$Extract" -PassThru -Wait
            Write-Host "SFX exit $($proc.ExitCode)"
            Start-Sleep -Seconds 5
          }
          # SFX / 7z may place files under a "LLVM" subdir or "lib/clang/..." subdir.
          # Locate the directory that directly contains include/ and lib/ by searching
          # for lib/clangTooling.lib up to 3 levels deep.
          $candidates = Get-ChildItem -Path $Extract -Recurse -Depth 4 -Filter "clangTooling.lib" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty DirectoryName
          if (-not $candidates) {
            Write-Error "clangTooling.lib not found under $Extract"
            Get-ChildItem $Extract -Depth 2 | ForEach-Object { Write-Host "  $($_.FullName.Replace($Extract, ''))" }
            exit 1
          }
          # llvm lib directory
          $libDir = $candidates[0]
          $llvmDir = Split-Path $libDir -Parent
          Write-Host "LLVM root detected at: $llvmDir"
          # Move contents of $llvmDir UP to $Root (flatten to $Root/include, $Root/lib)
          Get-ChildItem -Force $llvmDir | Move-Item -Destination $Root -Force
          # Clean temporary extraction leftovers
          Remove-Item -Recurse -Force $Extract -ErrorAction SilentlyContinue
          # Verify
          if (-not (Test-Path (Join-Path $Root "include\clang\AST\ASTConsumer.h")) -or
              -not (Test-Path (Join-Path $Root "lib\clangTooling.lib"))) {
            Write-Error "Post-flatten verification failed for $Root"
            Get-ChildItem $Root | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }
          Write-Host "LLVM $Version ready at $Root"

      - name: Configure CMake (with Clang AST enabled, network LLVM)
        shell: pwsh
        run: |
          $Repo = Get-Location
          $InstallDir = Join-Path "${{ runner.workspace }}" "llvm-18.1.8-win64"
          if (-not (Test-Path (Join-Path $InstallDir "lib\clangTooling.lib"))) {
            Write-Error "LLVM libs missing in $InstallDir"; exit 1
          }
          $Build = Join-Path $Repo "build_release_x64"
          Write-Host "Using generator: $env:CMAKE_GENERATOR"
          cmake -S $Repo -B $Build `
            -G $env:CMAKE_GENERATOR `
            -A $env:ARCH `
            -DCODEX_LAN_AGENT_ENABLE_CLANG_AST=ON `
            -DCODEX_LAN_AGENT_BUILD_CLANG_INDEXER=OFF `
            -DCODEX_LAN_AGENT_COPY_TO_ROOT=OFF `
            -DCODEX_LAN_AGENT_BUNDLE_CMM=OFF `
            -DCODEX_LLVM_ROOT="$InstallDir"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed ($LASTEXITCODE)" }

      - name: Build Release
        shell: pwsh
        run: |
          $Build = Join-Path (Get-Location) "build_release_x64"
          cmake --build $Build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed ($LASTEXITCODE)" }
          $Exe = Join-Path $Build "Release\codex_lan_agent.exe"
          if (-not (Test-Path $Exe)) {
            # also try plain (single-config generator fallback)
            $Exe = Join-Path $Build "codex_lan_agent.exe"
          }
          if (-not (Test-Path $Exe)) { Write-Error "codex_lan_agent.exe not built"; exit 1 }
          Write-Host "Build OK: $Exe  $([math]::Round((Get-Item $Exe).Length/1MB,2)) MB"

      - name: Stage release package
        shell: pwsh
        run: |
          $Repo = Get-Location
          $Build = Join-Path $Repo "build_release_x64"
          $Exe = Join-Path $Build "Release\codex_lan_agent.exe"
          if (-not (Test-Path $Exe)) { $Exe = Join-Path $Build "codex_lan_agent.exe" }
          $Stage = Join-Path $Repo "stage\codex_lan_agent-windows-x64"
          New-Item -ItemType Directory -Force -Path (Join-Path $Stage "bin") | Out-Null
          Copy-Item $Exe (Join-Path $Stage "bin\codex_lan_agent.exe")
          if (Test-Path (Join-Path $Repo "codex_lan_agent.cfg")) {
            Copy-Item (Join-Path $Repo "codex_lan_agent.cfg") $Stage
          }
          if (Test-Path (Join-Path $Repo "README.md")) {
            Copy-Item (Join-Path $Repo "README.md") $Stage
          }
          if (Test-Path (Join-Path $Repo "LICENSE")) {
            Copy-Item (Join-Path $Repo "LICENSE") $Stage
          }
          $Zip = Join-Path $Repo "codex_lan_agent-windows-x64.zip"
          if (Test-Path $Zip) { Remove-Item $Zip }
          Compress-Archive -Path (Join-Path $Stage "*") -DestinationPath $Zip
          $zipItem = Get-Item $Zip
          Write-Host "Package: $($zipItem.Name)  $([math]::Round($zipItem.Length/1MB,2)) MB"

      - name: Create GitHub Release and upload artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Repo = Get-Location
          $Zip = Join-Path $Repo "codex_lan_agent-windows-x64.zip"
          if (-not (Test-Path $Zip)) { Write-Error "zip missing" ; exit 1 }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.tag }}' -ne '') {
            $Tag = '${{ github.event.inputs.tag }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $Tag = '${{ github.ref_name }}'
          } else {
            $Tag = 'v' + (Get-Date -Format 'yyyy.MM.dd') + '-x64'
            Write-Host "No tag context, fallback: $Tag"
          }
          $Sha = (git rev-parse HEAD).Substring(0,7)
          $Body = @"
          ## codex_lan_agent $Tag (Windows x64)

          ### Online build (GitHub-hosted runner, fully online)
          - Runner: windows-latest (Visual Studio pre-installed image)
          - CMake generator used by runner: $env:CMAKE_GENERATOR
          - Target arch: x64
          - Standard: C++17 / C99
          - Clang AST parsing: enabled (-DCODEX_LAN_AGENT_ENABLE_CLANG_AST=ON)
          - Commit sha: $Sha

          ### Third-party dependencies (ALL from network sources, nothing vendored in repo)
          - **LLVM/Clang 18.1.8** (official prebuilt Windows x64, network download)
            - Download URL: https://github.com/llvm/llvm-project/releases/tag/llvmorg-18.1.8
            - Artifact: LLVM-18.1.8-win64.exe
            - License: Apache-2.0 WITH LLVM-exception  https://llvm.org/LICENSE.txt
          - Static linkage: every LLVM/Clang .lib is statically linked into the exe.
            Release ZIP contains NO .lib/.dll. Repo NEVER ships third-party binaries.

          ### Reproduce locally
          ```powershell
          git clone https://github.com/${{ github.repository }}.git
          cd codex-lan-agent
          # Download + extract LLVM 18.1.8 (network source) -> third_party\llvm\
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCODEX_LAN_AGENT_ENABLE_CLANG_AST=ON
          cmake --build build --config Release --parallel
          ```

          ### Repo contents policy (.gitignore whitelist · enforced)
          - Allowed: `CMakeLists.txt` · `src/**` · `.github/workflows/**`
          - DENIED: `*.exe *.dll *.lib *.obj *.o *.a` · images · archives · `third_party/` · `vendor/`
          "@
          $NotesFile = Join-Path $env:RUNNER_TEMP "release_notes_$Tag.md"
          $Body | Out-File -FilePath $NotesFile -Encoding utf8
          $existing = gh release view $Tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $Tag..."
            gh release create $Tag --repo '${{ github.repository }}' `
              --title "codex_lan_agent $Tag · Windows x64 (LLVM 18.1.8, online build)" `
              --notes-file $NotesFile `
              --target '${{ github.sha }}' `
              $Zip
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          } else {
            Write-Host "Release $Tag exists; uploading asset..."
            gh release upload $Tag --repo '${{ github.repository }}' --clobber $Zip
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
          }
          Write-Host "=== Release completed for tag $Tag ==="
