# ============================================
# IRC Bridge（C++ 内置线程，不跑 Python）
# 8067 = plaintext WebSocket（IRC channel 消息走这个）
# 8600 = TLS JSON-RPC（只用来做 RPC 查询，不发 channel）
# ★ message.send_privmsg RPC 只能发 user/nick，不能发 channel！
#   channel 消息必须从 WS client 发 PRIVMSG
# ============================================
irc_enabled=true
irc_ws_host=192.168.5.100
irc_ws_port=80
irc_ws_path=/ws
irc_bot_nick=seedcode-bridge
irc_bot_user=codex-bridge
irc_default_channel=#main

# 出向控制
irc_output_enabled=true
irc_output_max_chars=450
irc_line_continuation= ↪
irc_push_rate_limit_per_min=15

# Agent 路由（@mention 前缀 → MCP method）
irc_agent.codex=lan_agent_run_local_chat
irc_agent.trae=lan_agent_run_local_chat
irc_agent.lan=lan_agent_run_cxparser_flow
irc_agent.rag=lan_agent_rag_review_observe
irc_agent.default=lan_agent_run_local_chat

# Phase 2 测试：cfg 驱动 RouteTable
# 只写 type=local （Step 1），验证 MatchRouteTable → ExecLocalRoute
irc_route.ping.type=local
irc_route.ping.keywords=ping,alive,在吗,活着,在线,你好,活着吗
irc_route.ping.reply=🏓 pong — bridge 在线（ws=${irc.ws_host}:${irc.ws_port}${irc.ws_path}/${irc.channel}）

irc_route.scope.type=local
irc_route.scope.keywords=关联,范围,scope,项目还是全局,哪个项目,隔离
irc_route.scope.reply=📁 scope=项目级 (workspace_root=${workspace_root})

irc_route.status.type=local
irc_route.status.keywords=配置,cfg,endpoint,llm,provider,8080,8095,8096,能用,可用,状态,status
irc_route.status.reply=⚙️ local_chat=${probe:127.0.0.1:8080}, generation=${probe:127.0.0.1:8095}, embedding=${probe:127.0.0.1:8096}, MCP=${mcp.dispatch}, bridge=🟢

irc_route.help.type=local
irc_route.help.keywords=帮助,help,怎么用,怎么触发,哪些命令,支持什么,routes,命令,触发,用法,使用
irc_route.help.reply=🧭 @<mention> <任务>→MCP | ping/scope/status/help→本地 | routes: codex,trae,lan,rag,default

# Phase 2 Step 4: type=llm — bridge 直连 OpenAI ChatCompletions（绕开 Lan-agent RunLocalChat）
# 当前无可用 endpoint，启用时取消注释：
# irc_route.llm.type=llm
# irc_route.llm.keywords=llm,大模型,chat,ai,模型
# irc_route.llm.endpoint=http://127.0.0.1:8095/v1/chat/completions
# irc_route.llm.model=gpt-4.1
# irc_route.llm.system=You are codex-bridge IRC agent. Answer concisely.
# irc_route.llm.timeout_ms=15000

# ctx-cli loop 核心：type=shell — bridge 用 popen 执行 shell 命令（grep/find/cat/git）
# 完全零依赖：不调 LLM、不走 MCP、服务不可用时也能跑！
# ${keywords_regex} = 空格转 | 拼接的 grep -E 正则 OR 多关键词
irc_route.shell.type=shell
irc_route.shell.keywords=搜,查找,grep,find,代码在哪,哪里有,搜索,src,文件,函数,类,定义,引用,在哪里,在哪,位置,实现,代码,PostJson,HttpClient,bridge,irc,route
irc_route.shell.command=grep -rn -E "${keywords_regex}" --include='*.cpp' --include='*.h' --include='*.cfg' /H/aisrc/lan-agent/src /H/aisrc/lan-agent/codex_lan_agent.cfg 2>/dev/null | head -15
irc_route.shell.keywords_from_task=true

# ctx-cli loop: ls — 列工作区文件
irc_route.ls.type=shell
irc_route.ls.keywords=列出,目录,文件列表,ls,list,有什么,看到
irc_route.ls.command=find /H/aisrc/lan-agent -maxdepth 3 -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.cfg' -o -name '*.md' \) | head -20
irc_route.ls.keywords_from_task=false

# ctx-cli loop: git — git log/status
irc_route.git.type=shell
irc_route.git.keywords=git,提交,commit,日志,log,修改,变更
irc_route.git.command=cd /H/aisrc/lan-agent && git log --oneline -10 2>/dev/null || git status --short 2>/dev/null || echo "(git 不可用)"
irc_route.git.keywords_from_task=false

# codex-cli loop: type=codex_cli — bridge popen codex_lan_agent CLI
# 注意：run-rag-flow 依赖 LLM 服务（会走 deterministic fallback）
# irc_route.codex_rag.type=codex_cli
# irc_route.codex_rag.keywords=rag,分析,总结,解释,review
# irc_route.codex_rag.command=run-rag-flow
# irc_route.codex_rag.args=${keywords} code_analysis

# codex-cli: health — 检查服务状态
irc_route.codex_health.type=codex_cli
irc_route.codex_health.keywords=agent状态,lan-agent状态,health,服务状态,运行没
irc_route.codex_health.command=health
irc_route.codex_health.args=

# —— @codex 主入口 ——
# mention 精确匹配: @codex → 直接走 shell route（零依赖 grep）
# keywords 兜底: "you can?" / "能做什么" 等也能触发
# codex 主入口 — 中文问句 / 能力询问 → local reply 直接说自己会啥
# 注意：cfg 改了需要重启 agent（不热加载）
irc_route.codex.type=local
irc_route.codex.keywords=codex,能做,可以,能力,功能,help,帮助,你好,what can you,功能列表,执行,任务,任务吗,跑,启动,运行,编译,build,make
irc_route.codex.reply=🧭 seedcode-bridge 能做: ctx-cli 等价命令 (ls/cat/grep/glob/wc/find), codex-cli 子命令 (ctx-ls/ctx-cat/ctx-grep/ctx-glob/ctx-wc/ctx-find/health/run-rag-flow/run-case), exec_perm=1 make build 编译. @mention <任务> 直接说

# codex execute — 真执行 shell 命令（exec_perm=1，exec_key 空=放行）
irc_route.codex_exec.type=shell
irc_route.codex_exec.keywords=run,exec,执行,跑,启动,运行,build,compile,cmake
irc_route.codex_exec.command=${task}
irc_route.codex_exec.exec_perm=1
irc_route.codex_exec.exec_key=
irc_route.codex_exec.keywords_from_task=false

# —— ctx-cli 全覆盖：cat 读文件 ——
# @codex-bridge cat src/IrcBridgeThread.h:200    → 读文件第 200 行附近
# @codex-bridge cat HttpClient.h                 → 读文件前 N 行
irc_route.cat.type=shell
irc_route.cat.keywords=cat,读文件,查看文件,打开文件,文件内容,内容,read file,read
irc_route.cat.command=awk -v kw="${keywords}" 'BEGIN{split(kw,a," "); f=""; line=0; for(i in a){ if(a[i] ~ /^[a-zA-Z].*\\.[ch]$/ || a[i] ~ /\\.h$/ || a[i] ~ /\\.cpp$/ || a[i] ~ /\\.cfg$/) f=a[i]; if(a[i] ~ /^[0-9]+$/) line=a[i]}} { if(f=="" || FILENAME==f) { if(line>0 && NR>=line-10 && NR<=line+30) print NR":"$0; else if(line==0 && NR<=80) print NR":"$0 } }' ${scope}/src/*.cpp ${scope}/src/*.h ${scope}/*.cfg 2>/dev/null | head -80
irc_route.cat.keywords_from_task=true

# —— ctx-cli 全覆盖：glob 路径模式 ——
# @codex-bridge glob IrcBridge     → 找包含 IrcBridge 的文件
# @codex-bridge glob *.h           → 找头文件（用 task 里的 glob 字符）
# command 里用 awk 过滤掉 route 触发词 "glob/通配/模式/pattern"
irc_route.glob.type=shell
irc_route.glob.keywords=glob,通配,模式,pattern,匹配路径,找文件,文件模式
irc_route.glob.command=PATTERN=$(echo "${task}" | awk 'BEGIN{IGNORECASE=1} {for(i=1;i<=NF;i++) if($i!~/^(glob|通配|模式|pattern|匹配路径|找文件|文件模式)$/) printf "%s", $i}'); find ${scope} -type f -name "*${PATTERN}*" 2>/dev/null | head -30
irc_route.glob.keywords_from_task=false

# —— ctx-cli 全覆盖：wc 统计 ——
# @codex-bridge wc src/IrcBridgeThread.cpp → 行数/字数统计
irc_route.wc.type=shell
irc_route.wc.keywords=wc,统计,行数,字数,多少行,文件大小,大小
irc_route.wc.command=find ${scope} -type f \\( -name '*${keywords}*' \\) -exec wc -lwc {} + 2>/dev/null | tail -20
irc_route.wc.keywords_from_task=true

# —— exec_perm=1 示例：make build（可执行操作，留空 exec_key=默认放行）——
# 如果 exec_key= 填了值（如 BUILD_AUTH_KEY），则需要 @codex-bridge make build key=BUILD_AUTH_KEY
irc_route.build.type=shell
irc_route.build.keywords=make,build,编译,构建,compile,cmake,ninja
irc_route.build.command=cd ${scope}/build && LD_LIBRARY_PATH=/H/usr/aisrc/cmake/usr/lib/x86_64-linux-gnu:/H/usr/aisrc/usr/lib/x86_64-linux-gnu /H/usr/aisrc/cmake/usr/bin/cmake --build . --target codex_lan_agent 2>&1 | tail -10
irc_route.build.keywords_from_task=false
irc_route.build.exec_perm=1
irc_route.build.exec_key=

# —— exec_perm=2 示例：rm 清理（危险操作，框架已拦截等待二次确认）——
irc_route.rm.type=shell
irc_route.rm.keywords=rm,删除,remove,清理,clean
irc_route.rm.command=echo "⚠️ exec_perm=2 危险操作（框架已拦截）: rm ${keywords}"
irc_route.rm.exec_perm=2

# —— 所有只读 route（exec_perm=0 默认，直接放行）——
# shell / ls / cat / glob / wc / git / codex / codex_health 都是只读

# 出向格式（字符串模板，{agent_label} 会被替换）
irc_prefix_success=[{agent_label}] ✅ 
irc_prefix_error=[{agent_label}] ❌ 
irc_prefix_progress=[{agent_label}] ⏳ 