# Minimal deployment config for codex_lan_agent.exe
listen_host=0.0.0.0
listen_port=18080
# Linux 路径适配（原 Windows 路径已注释）
workspace_root=/H/aisrc/lan-agent
manual_workspace_root=/H/aisrc
allowed_roots=/H/aisrc/lan-agent;/H/aisrc
# cxparser_public_build_root=/H/aisrc/cxparser/build

log_root=${AGENT_DIR}/logs
generation_endpoint=http://127.0.0.1:8095/v1/chat/completions
embedding_endpoint=http://127.0.0.1:8096/v1/embeddings
local_chat_endpoint=http://127.0.0.1:8080/local-chat
tool_config_path=${AGENT_DIR}/tool_config.json
task_timeout_sec=1800
cmm_binary_path=${AGENT_DIR}/codebase-memory-mcp.exe
optfile_write_enabled=true
direct_file_write_enabled=false

