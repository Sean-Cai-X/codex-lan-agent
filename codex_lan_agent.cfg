# Minimal deployment config for codex_lan_agent.exe
listen_host=0.0.0.0
listen_port=18080
workspace_root=D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent
manual_workspace_root=D:/Hdevelop
allowed_roots=D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent;D:/Codex-WorkDir/Sean_WorkDir/cxvisionai;D:/Codex-WorkDir/Sean_WorkDir/cxparser;D:/Codex-WorkDir/Sean_WorkDir/cxparser_ext;D:/Codex-WorkDir/Sean_WorkDir/AItest/muparser-master/src
cxparser_public_build_root=D:/Codex-WorkDir/Sean_WorkDir/cxparser/build

log_root=${AGENT_DIR}/logs
generation_endpoint=http://127.0.0.1:8095/v1/chat/completions
embedding_endpoint=http://127.0.0.1:8096/v1/embeddings
local_chat_endpoint=http://127.0.0.1:8080/local-chat
tool_config_path=${AGENT_DIR}/tool_config.json
task_timeout_sec=1800
cmm_binary_path=${AGENT_DIR}/codebase-memory-mcp.exe
optfile_write_enabled=true
direct_file_write_enabled=false

profile.build_cxcore_smoke=powershell -ExecutionPolicy Bypass -File "${AGENT_DIR}/agent_profiles/build_cxcore_smoke.ps1"
profile.build_rag_smoke=powershell -ExecutionPolicy Bypass -File "${AGENT_DIR}/agent_profiles/build_rag_smoke.ps1"
profile.build_target="${AGENT_DIR}/cmake_dispatch.exe"
profile.build_and_test=powershell -ExecutionPolicy Bypass -File "${AGENT_DIR}/agent_profiles/build_and_test.ps1"
profile.apply_sync_bundle="${AGENT_DIR}/sync_bundle_apply.exe"
profile.check_build_dir="${AGENT_DIR}/builddir_guard.exe"
profile.configure_project="${AGENT_DIR}/cmake_dispatch.exe"
profile.prepare_build_dir="${AGENT_DIR}/builddir_guard.exe"
profile.run_case="${AGENT_DIR}/case_preview.exe"
profile.run_script=powershell -ExecutionPolicy Bypass -File "${AGENT_DIR}/agent_profiles/run_script.ps1"
profile.run_ctest_smoke=powershell -ExecutionPolicy Bypass -File "${AGENT_DIR}/agent_profiles/run_ctest_smoke.ps1"
profile.run_ctest_target="${AGENT_DIR}/cmake_dispatch.exe"


# Configurable run-light action for cxvision Headless/imgui acceptance.
# After changing these values, restart codex_lan_agent serve; no rebuild is required.
profile.cxvision_imgui_acceptance="D:/Codex-WorkDir/Sean_WorkDir/cxvisionai/build01/Release/cxvision_imgui_acceptance.exe"
profile_timeout.cxvision_imgui_acceptance=1800
profile_stall_timeout.cxvision_imgui_acceptance=120
local_cli_run_light.run_cxvision_imgui_acceptance=cxvision_imgui_acceptance


# Qt desktop/image bridge used by Codex to operate the desktop and call cxvision analysis.
# Build source: D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent/cxvision_ui_bridge/main.cxx + cxvision_ui_bridge.pro
profile.cxvision_ui_bridge="D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent/cxvision_ui_bridge.exe"
profile_timeout.cxvision_ui_bridge=1800
profile_stall_timeout.cxvision_ui_bridge=120
local_cli_run_light.ui_screenshot=cxvision_ui_bridge
local_cli_run_light.ui_cursor=cxvision_ui_bridge
local_cli_run_light.ui_move=cxvision_ui_bridge
local_cli_run_light.ui_click=cxvision_ui_bridge
local_cli_run_light.ui_key=cxvision_ui_bridge
local_cli_run_light.ui_key_press=cxvision_ui_bridge
local_cli_run_light.ui_type=cxvision_ui_bridge
local_cli_run_light.ui_hotkey=cxvision_ui_bridge
local_cli_run_light.ui_activate_window=cxvision_ui_bridge
local_cli_run_light.ui_get_focused_control=cxvision_ui_bridge
local_cli_run_light.ui_analyze=cxvision_ui_bridge
local_cli_run_light.ui_screenshot_analyze=cxvision_ui_bridge

profile.build_cxvision_ui_bridge="D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent/build_cxvision_ui_bridge.bat"
profile_timeout.build_cxvision_ui_bridge=600
profile_stall_timeout.build_cxvision_ui_bridge=120
local_cli_run_light.build_cxvision_ui_bridge=build_cxvision_ui_bridge
# Repository upload policy validation. Use local_cli command=run-light with args_text=verify_repo_upload_policy.
profile.verify_repo_upload_policy=powershell -ExecutionPolicy Bypass -File "D:/Codex-WorkDir/Sean_WorkDir/codex-lan-agent/scripts/verify_repo_upload_policy.ps1"
profile_timeout.verify_repo_upload_policy=120
profile_stall_timeout.verify_repo_upload_policy=30
local_cli_run_light.verify_repo_upload_policy=verify_repo_upload_policy